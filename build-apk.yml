name: Build Android APK

# Builds an installable NdauSight AI APK in the cloud — no local setup needed.
# Runs automatically on every push to main/master, and can be triggered manually
# from the Actions tab (Run workflow). The finished APK is attached to the run
# as a downloadable artifact.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.29.2"
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms=android --org com.ndausight --project-name ndausight

      - name: Restore custom AndroidManifest (camera/GPS permissions)
        run: git checkout -- android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ndausight-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Also build a split-per-ABI set (smaller downloads) — optional.
      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload split APKs
        uses: actions/upload-artifact@v4
        with:
          name: ndausight-split-apks
          path: build/app/outputs/flutter-apk/*.apk
