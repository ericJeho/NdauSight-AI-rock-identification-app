# Codemagic build config — an alternative to GitHub Actions.
# Sign in at https://codemagic.io with your Git provider, add this repo, and
# start a build. The APK appears under the build's Artifacts, and Codemagic can
# also email it to you. No local toolchain required.

workflows:
  android-apk:
    name: NdauSight AI Android APK
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Generate Android platform files
        script: flutter create . --platforms=android --org com.ndausight --project-name ndausight
      - name: Restore custom AndroidManifest (permissions)
        script: git checkout -- android/app/src/main/AndroidManifest.xml
      - name: Get packages
        script: flutter pub get
      - name: Generate launcher icon & splash screen
        script: |
          dart run flutter_native_splash:create
          dart run flutter_launcher_icons
      - name: Run tests
        script: flutter test
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - ericpadambo@gmail.com
        notify:
          success: true
          failure: true
