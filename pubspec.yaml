name: ndausight
description: NdauSight AI — photograph rocks, identify minerals, and estimate precious-mineral potential in the field.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Camera & images
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  path: ^1.9.0

  # Location & maps
  geolocator: ^12.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Networking
  http: ^1.2.2

  # Offline storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Connectivity for offline / sync
  connectivity_plus: ^6.0.5

  # Misc
  intl: ^0.19.0
  uuid: ^4.4.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# ---------------------------------------------------------------------------
# App launcher icon (run: dart run flutter_launcher_icons)
# Source art is generated by tool/generate_brand_assets.py
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1F2933"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#1F2933"
    theme_color: "#C9A227"

# ---------------------------------------------------------------------------
# Splash screen (run: dart run flutter_native_splash:create)
# ---------------------------------------------------------------------------
flutter_native_splash:
  color: "#1F2933"
  image: "assets/splash/splash.png"
  android: true
  ios: true
  web: false
  android_12:
    color: "#1F2933"
    image: "assets/splash/splash.png"
